name: Publish Python package

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: swmmx-publishing
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build
        run: python -m pip install --upgrade build twine

      - name: Build package
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Check package version on PyPI
        id: version
        run: |
          python - <<'PYCODE'
          import os
          import tomllib
          from urllib.error import HTTPError
          from urllib.request import urlopen

          with open('pyproject.toml', 'rb') as f:
              version = tomllib.load(f)['project']['version']
          ref = os.environ['GITHUB_REF']
          if ref.startswith('refs/tags/') and ref != f'refs/tags/v{version}':
              raise SystemExit(f'Tag {ref} does not match package version {version}')
          try:
              with urlopen(f'https://pypi.org/pypi/swmmx/{version}/json', timeout=30):
                  publish = 'false'
          except HTTPError as exc:
              if exc.code != 404:
                  raise
              publish = 'true'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              print(f'version={version}', file=f)
              print(f'publish={publish}', file=f)
          print(f'swmmx {version}: new PyPI version = {publish}')
          PYCODE

      - name: Store built package
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish-to-testpypi:
    name: Publish to TestPyPI
    if: github.ref == 'refs/heads/main' && needs.build.outputs.publish == 'true'
    needs:
      - build
    runs-on: ubuntu-latest

    environment:
      name: testpypi
      url: https://test.pypi.org/p/swmmx

    permissions:
      id-token: write

    steps:
      - name: Download built package
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-to-pypi:
    name: Publish to PyPI
    if: needs.build.outputs.publish == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs:
      - build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/swmmx

    permissions:
      id-token: write

    steps:
      - name: Download built package
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  create-github-release:
    name: Create GitHub Release
    if: needs.publish-to-pypi.result == 'success'
    needs:
      - build
      - publish-to-pypi
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download built package
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: swmmx v${{ needs.build.outputs.version }}
          tag_name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.whl
